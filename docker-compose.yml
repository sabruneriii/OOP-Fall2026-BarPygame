services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: barpygame:latest
    working_dir: /workspace/virgin-bartending-game
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./:/workspace
    environment:
      SDL_AUDIODRIVER: dummy
      Home: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    command: ["python", "main.py"]
